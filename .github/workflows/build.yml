name: Build Full AyuGram with AWG

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Custom AyuGram
    runs-on: ubuntu-latest

    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout AWG Source Code
        uses: actions/checkout@v4
        with:
          path: awg-plugin

      - name: Checkout AyuGram4A Source Code
        uses: actions/checkout@v4
        with:
          repository: ufoptg/AyuGram4A
          submodules: recursive
          path: AyuGram4A

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r25c
          add-to-path: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build libawg.so for Android
        working-directory: awg-plugin/awg-go-lib
        run: |
          go mod download
          
          build_arch() {
            ARCH=$1
            NDK_ARCH=$2
            COMPILER=$3
            mkdir -p ../../AyuGram4A/TMessagesProj/src/main/jniLibs/$ARCH
            env CGO_ENABLED=1 GOOS=android GOARCH=$NDK_ARCH CC=${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/$COMPILER AR=${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar go build -buildmode=c-shared -ldflags="-s -w" -o ../../AyuGram4A/TMessagesProj/src/main/jniLibs/$ARCH/libawg.so .
          }
          
          build_arch "arm64-v8a" "arm64" "aarch64-linux-android21-clang"
          build_arch "armeabi-v7a" "arm" "armv7a-linux-androideabi21-clang"
          build_arch "x86_64" "amd64" "x86_64-linux-android21-clang"

      - name: Inject AWG Source Code into AyuGram
        run: |
          mkdir -p AyuGram4A/TMessagesProj/src/main/java/org/telegram/awg
          mkdir -p AyuGram4A/TMessagesProj/src/main/java/org/telegram/ui/awg
          cp awg-plugin/android-patch/java/org/telegram/awg/*.java AyuGram4A/TMessagesProj/src/main/java/org/telegram/awg/
          cp awg-plugin/android-patch/java/org/telegram/ui/awg/*.java AyuGram4A/TMessagesProj/src/main/java/org/telegram/ui/awg/

      - name: Patch AyuGram Source Code (Python Script)
        run: |
          cat << 'EOF' > patch.py
          import re
          import os

          # 1. Интеграция автозапуска в ApplicationLoader
          app_loader = "AyuGram4A/TMessagesProj/src/main/java/org/telegram/messenger/ApplicationLoader.java"
          with open(app_loader, "r", encoding="utf-8") as f:
              code = f.read()

          code = code.replace("import org.telegram.messenger.voip.VoIPService;", "import org.telegram.messenger.voip.VoIPService;\nimport org.telegram.awg.AWGLib;\nimport org.telegram.awg.AWGManager;")
          
          init_code = """
                  try {
                      AWGLib.load(this);
                      AWGManager.getInstance().init();
                      android.util.Log.i("AWGTelegram", "AWG Manager Initialized");
                  } catch (Exception e) {
                      android.util.Log.e("AWGTelegram", "AWG init failed: " + e.getMessage());
                  }
          """
          code = re.sub(r'(super\.onCreate\(\);)', r'\1\n' + init_code, code)

          with open(app_loader, "w", encoding="utf-8") as f:
              f.write(code)

          # 2. Интеграция скрытой ссылки tg://awg в LaunchActivity
          launch_act = "AyuGram4A/TMessagesProj/src/main/java/org/telegram/ui/LaunchActivity.java"
          with open(launch_act, "r", encoding="utf-8") as f:
              code = f.read()

          code = code.replace("import org.telegram.messenger.AndroidUtilities;", "import org.telegram.messenger.AndroidUtilities;\nimport org.telegram.ui.awg.AWGSettingsActivity;")
          
          intent_code = """
                  if (intent != null && intent.getData() != null && "tg".equals(intent.getData().getScheme()) && "awg".equals(intent.getData().getHost())) {
                      actionBarLayout.presentFragment(new AWGSettingsActivity());
                      return true;
                  }
          """
          code = re.sub(r'(private boolean handleIntent\(Intent [^)]*\)\s*\{)', r'\1\n' + intent_code, code)
          
          with open(launch_act, "w", encoding="utf-8") as f:
              f.write(code)
              
          print("Patched successfully!")
          EOF
          python3 patch.py

      - name: Generate API Keys and Keystore
        working-directory: AyuGram4A
        run: |
          cat << 'EOF' > API_KEYS
          APP_ID = 2040
          APP_HASH = "b18441a1ff607e10a989891a5462e627"
          MAPS_V2_API = "dummy_maps_key"
          SIGNING_KEY_PASSWORD = "dummy123"
          SIGNING_KEY_ALIAS = "dummy"
          SIGNING_KEY_STORE_PASSWORD = "dummy123"
          EOF
          
          mkdir -p TMessagesProj/config
          rm -f TMessagesProj/config/extera.jks
          keytool -genkey -v -keystore TMessagesProj/config/extera.jks -keyalg RSA -keysize 2048 -validity 10000 -alias dummy -dname "CN=Ayu, OU=Gram, O=AyuGram, L=City, S=State, C=US" -storepass dummy123 -keypass dummy123
          
          cat << 'EOF' > TMessagesProj/google-services.json
          {
            "project_info": { "project_number": "12345", "project_id": "dummy" },
            "client": [ { "client_info": { "mobilesdk_app_id": "1:123:android:123", "android_client_info": { "package_name": "org.telegram.messenger" } }, "api_key": [ { "current_key": "dummy" } ] } ],
            "configuration_version": "1"
          }
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build AyuGram APK
        working-directory: AyuGram4A
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-AWG-Custom
          path: AyuGram4A/TMessagesProj/build/outputs/apk/**/*.apk
