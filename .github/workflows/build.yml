name: Build Custom AyuGram

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build python3 golang-go
          
      - name: Clone AyuGram4A
        run: |
          git clone --recursive https://github.com/ufoptg/AyuGram4A.git AyuGram4A
          cd AyuGram4A
          git submodule update --init --recursive
          
      - name: Patch AyuGram Java Code
        working-directory: AyuGram4A
        run: |
          cat << 'EOF' > patch_ayugram.py
          import os

          # 1. Добавляем вызов туннеля в ApplicationLoader
          app_loader = "TMessagesProj/src/main/java/org/telegram/messenger/ApplicationLoader.java"
          with open(app_loader, "r", encoding="utf-8") as f:
              content = f.read()
              
          if "System.loadLibrary(\"awg\");" not in content:
              insert_idx = content.find("public void onCreate()")
              if insert_idx != -1:
                  insert_idx = content.find("{", insert_idx) + 1
                  content = content[:insert_idx] + "\n        try { System.loadLibrary(\"awg\"); android.util.Log.d(\"AWG\", \"AmneziaWG loaded\"); } catch (Throwable e) { e.printStackTrace(); }\n" + content[insert_idx:]
                  
              with open(app_loader, "w", encoding="utf-8") as f:
                  f.write(content)

          # 2. Перехватываем tg://awg в LaunchActivity
          launch_act = "TMessagesProj/src/main/java/org/telegram/ui/LaunchActivity.java"
          with open(launch_act, "r", encoding="utf-8") as f:
              content = f.read()
              
          if "tg://awg" not in content:
              handler_idx = content.find("if (url != null && url.startsWith(\"tg://\")) {")
              if handler_idx != -1:
                  handler_idx = content.find("{", handler_idx) + 1
                  injection = """
                  if (url.startsWith("tg://awg")) {
                      android.widget.Toast.makeText(this, "AmneziaWG Tunnel Activated!", android.widget.Toast.LENGTH_LONG).show();
                      // Здесь вызывается ваша JNI функция старта туннеля
                      return true;
                  }
                  """
                  content = content[:handler_idx] + injection + content[handler_idx:]
                  
              with open(launch_act, "w", encoding="utf-8") as f:
                  f.write(content)
                  
          print("Patched successfully")
          EOF
          python3 patch_ayugram.py

      - name: Generate API Keys and Keystore
        working-directory: AyuGram4A
        run: |
          cat << 'EOF' > API_KEYS
          APP_ID = 2040
          APP_HASH = "b18441a1ff607e10a989891a5462e627"
          MAPS_V2_API = "dummy_maps_key"
          SIGNING_KEY_PASSWORD = "dummy123"
          SIGNING_KEY_ALIAS = "dummy"
          SIGNING_KEY_STORE_PASSWORD = "dummy123"
          EOF
          
          mkdir -p TMessagesProj/config
          rm -f TMessagesProj/config/extera.jks
          keytool -genkey -v -keystore TMessagesProj/config/extera.jks -keyalg RSA -keysize 2048 -validity 10000 -alias dummy -dname "CN=Ayu, OU=Gram, O=AyuGram, L=City, S=State, C=US" -storepass dummy123 -keypass dummy123
          
          cat << 'EOF' > TMessagesProj/google-services.json
          {
            "project_info": { "project_number": "12345", "project_id": "dummy" },
            "client": [
              { "client_info": { "mobilesdk_app_id": "1:123:android:123", "android_client_info": { "package_name": "org.telegram.messenger" } }, "api_key": [ { "current_key": "dummy" } ] },
              { "client_info": { "mobilesdk_app_id": "1:123:android:124", "android_client_info": { "package_name": "com.radolyn.ayugram" } }, "api_key": [ { "current_key": "dummy" } ] },
              { "client_info": { "mobilesdk_app_id": "1:123:android:125", "android_client_info": { "package_name": "com.radolyn.ayugram.beta" } }, "api_key": [ { "current_key": "dummy" } ] }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Build AyuGram APK
        working-directory: AyuGram4A
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon -Dorg.gradle.jvmargs="-Xss16m -Xmx4g"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-AWG-Custom
          path: AyuGram4A/TMessagesProj/build/outputs/apk/**/*.apk
